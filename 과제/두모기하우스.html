<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>두모기 하우스</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f3ef;
            color: #333;
            font-family: "Gaegu", cursive;
            font-weight: 500;
            font-size: large;
            line-height: 1.6;
            text-align: center;
        }

        a {
            text-decoration: none;
            color: #444;
        }

        img {
            width: 100%;
            border-radius: 15px;
        }

        header {
            background: white;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .1);
        }

        header h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        h1,
        h2,
        h3 {
            color: #5c4631;
            font-family: "Jua", sans-serif;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
        }

        nav a:hover {
            color: #ff8c42;
        }

        main {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        section {
            background: white;
            margin-bottom: 30px;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
        }

        section h2 {
            margin-bottom: 20px;
        }

        .cat-list {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .cat {
            width: 280px;
            padding: 20px;
            border: 1px solid #e8e8e8;
            border-radius: 18px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .05);
            transition: .3s;
        }

        .cat:hover {
            transform: translateY(-5px);
        }

        .cat img {
            margin-bottom: 15px;
        }

        .cat h3 {
            margin-bottom: 10px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .gallery img {
            border-radius: 15px;
        }

        .gallery img:hover {
            opacity: .8;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background: #caa57b;
            color: white;
            font: size 20px;
            font-family: "Gaegu", cursive;
            cursor: pointer;
        }

        button:hover {
            background: #b88d62;
        }

        footer {
            background: white;
            padding: 20px;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, .08);
        }
    </style>

</head>

<body>

    <header>

        <h1>🐱 두모기 하우스</h1>

        <p>Dubu · Mocha · Aegi</p>

        <nav>
            <a href="#intro">🏠 소개</a>
            <a href="#cats">🐾 고양이들</a>
            <a href="#gallery">📸 갤러리</a>
            <a href="#youtube">▶ 유튜브</a>
        </nav>

    </header>

    <main>

        <section id="intro">

            <h2>🏠 소개</h2>

            <p>
                안녕하세요! 두모기 하우스입니다.<br>
                저희 집의 첫째 두부, 둘째 모카,
                막내 애기를 소개합니다.
            </p>

        </section>

        <section id="cats">

            <h2>🐾 우리집 고양이들</h2>

            <div class="cat-list">

                <div class="cat">

                    <!-- TODO : 두부 사진 넣기 -->
                    <img src="두부.jpg" alt="두부">

                    <h3>🤍두부🤍</h3>

                    <p>
                        첫째 고양이<br>
                        스코티시 폴드
                    </p>

                </div>

                <div class="cat">

                    <!-- TODO : 모카 사진 넣기 -->
                    <img src="프로필이미지.jpg" alt="모카">

                    <h3>🤎모카🤎</h3>

                    <p>
                        둘째 고양이<br>
                        회색빛 삼색냥이
                    </p>

                </div>

                <div class="cat">

                    <!-- TODO : 애기 사진 넣기 -->
                    <img src="애기.jpg" alt="애기">

                    <h3>🖤애기🖤</h3>

                    <p>
                        막내 고양이<br>
                        사고뭉치 턱시도냥
                    </p>

                </div>

            </div>

        </section>

        <section id="gallery">

            <h2>📸 두모기 앨범</h2>

            <div class="gallery">

                <!-- TODO : 갤러리 사진 넣기 -->
                <img src="두모기1.jpg" alt="1">
                <img src="두모기2.jpg" alt="2">
                <img src="모기1.jpg" alt="3">
                <img src="모기2.jpg" alt="4">
                <img src="두부1.jpg" alt="5">
                <img src="모카.jpg" alt="6">

            </div>

        </section>

        <section id="youtube">

            <h2>▶ 두모기 유튜브</h2>

            <p>
                세 마리의 귀여운 일상이 궁금하다면<br>
                아래 버튼을 눌러 놀러오세요!
            </p>

            <button onclick="goYoutube()">🐱 유튜브 바로가기</button>

        </section>

    </main>

    <footer>

        <p>© Dumogi House</p>

    </footer>

    <script>

        function goYoutube() {
            window.open("https://youtube.com/@dumogi_47?si=Ii0CKWbJDG26IXSm", "_blank");
        }

    </script>

</body>

</html>
